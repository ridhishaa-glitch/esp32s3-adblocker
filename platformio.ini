; ESP32-S3 Ad Blocker (N16R8: 16MB flash / 8MB PSRAM)
; PlatformIO + Arduino framework

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; --- N16R8: 16MB flash, 8MB (octal) PSRAM ---
; qio_opi = QIO flash + OPI (octal) PSRAM, which is what the R8 variant uses.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_speed = 115200
upload_speed = 921600

build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=2
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=0
	-DADBLOCK_FW_VERSION=\"0.1.0\"
	-std=gnu++17
build_unflags =
	-std=gnu++11

lib_deps =
	esp32async/ESPAsyncWebServer @ ^3.7.0
	esp32async/AsyncTCP @ ^3.3.2
	bblanchon/ArduinoJson @ ^7.2.0
